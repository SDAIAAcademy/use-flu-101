<section>
<h2>الوحدة 1: ما البيانات وما الذكاء الاصطناعي، وأين ينتهي دورك</h2>
<ol>
<li><p>أربعة مشاهد من صباح واحد في مطار النخيل. في أي مشهد استعان الموظف بالذكاء الاصطناعي؟</p><ul><li><b>أ.</b> كتب يزن تقرير العطل بنفسه في محرر النصوص</li><li><b>ب.</b> اتصل جواد بزميله ليسأله عن وردية الغد</li><li><b>ج.</b> قبلت أبرار ترجمة اقترحها برنامج البريد لرسالة واردة</li><li><b>د.</b> فتحت ريما مجلد السياسات وقرأت سياسة الإجازات</li></ul></li>
<li><p>يقول لك زميل: «زميل» لا يرى أرصدة الإجازات. عندك صلاحية على ملف الأرصدة، فارفعه إليه ليجيب الموظفين مباشرة. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> تعتذر، وترفع الطلب إلى مالك النظام ومالك البيانات</li><li><b>ب.</b> ترفع الملف، فصلاحيتك عليه تكفي</li><li><b>ج.</b> ترفعه ساعة واحدة للتجربة ثم تحذفه</li><li><b>د.</b> تحذف الأسماء من الملف ثم ترفعه</li></ul></li>
<li><p>نظام إدارة البوابات في مطار المرفأ يقترح على موظف التشغيل أنسب بوابة لكل رحلة قادمة، فيقبل الموظف الاقتراح أو يختار بوابة أخرى. في أي خانة يقع ما يفعله الموظف؟</p><ul><li><b>أ.</b> عمل متخصص، لأنه يتعامل مع نظام ذكي</li><li><b>ب.</b> استخدام يومي لتوصية آلية</li><li><b>ج.</b> عمل لا يدخل فيه الذكاء الاصطناعي، لأن القرار للموظف</li><li><b>د.</b> عمل حوكمة، لأنه يحدد بوابات الرحلات</li></ul></li>
<li><p>نموذج الطوابير في مطار النخيل ينبّه المشرفين حين يتجاوز الانتظار المتوقع حدًّا معينًا. يرى مشرف أن التنبيهات كثيرة، ويعرف كيف يصل إلى شاشة الإعدادات. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> يرفع ملاحظته إلى فريق النموذج</li><li><b>ب.</b> يغيّر الحد بنفسه، فهو أعرف بصالته</li><li><b>ج.</b> يغيّر الحد أسبوعًا واحدًا للتجربة ثم يعيده كما كان</li><li><b>د.</b> يتجاهل التنبيهات إلى أن تقلّ</li></ul></li>
<li><p>في جدول حضور الورديات ظهر الموظف نفسه مرتين في اليوم نفسه بساعات الدخول والخروج نفسها، فزاد مجموع ساعات القسم. أي عيب من عيوب السجلات هذا؟</p><ul><li><b>أ.</b> سجل ناقص</li><li><b>ب.</b> سجل قديم</li><li><b>ج.</b> سجل مكرر</li><li><b>د.</b> تنبؤ خاطئ</li></ul></li>
<li><p>سألت مساعدًا عن رقم هاتف مكتب المفقودات في مطار الجبل، فأعطاك رقمًا بصيغة صحيحة تمامًا، ثم تبيّن أنه ليس رقم المكتب. ما أرجح تفسير؟</p><ul><li><b>أ.</b> المساعد تعمّد أن يضللك</li><li><b>ب.</b> الرقم صحيح، والمكتب غيّر رقمه اليوم</li><li><b>ج.</b> قاعدة بيانات المساعد معطلة هذه الساعة</li><li><b>د.</b> ولّد المساعد ما يشبه رقم هاتف</li></ul></li>
<li><p>أي عملين من هذه الأعمال الأربعة يعودان إلى فريق مختص، لا إلى من يستخدم الأداة؟ اختر اثنين.</p><ul><li><b>أ.</b> اختبار دقة نموذج قبل اعتماده في العمل</li><li><b>ب.</b> فرز جدول الطلبات بحسب التاريخ</li><li><b>ج.</b> تحديد من يحق له أن يرى لوحة الرواتب</li><li><b>د.</b> طلب إعادة صياغة فقرة من المساعد المعتمد</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 2: الأدوات المعتمدة وحماية المعلومات</h2>
<ol>
<li><p>تريد مديرة أن يظهر في لوحة المبيعات عمود جديد، فتطلب من موظف عنده صلاحية تعديل أن يغيّر معادلة الحساب في مصدر اللوحة. في أي خانة يقع الطلب؟</p><ul><li><b>أ.</b> عمل متخصص يُرفع إلى مالك اللوحة</li><li><b>ب.</b> استخدام يومي، مثل التصفية والفرز</li><li><b>ج.</b> حالة لا يدخل فيها الذكاء الاصطناعي ولا البيانات</li></ul></li>
<li><p>تريد ريما أن تختصر تعميمًا داخليًا من ثلاث صفحات، ولا محتوى شخصيًا فيه. أي طريق من هذه معتمد في طيف؟</p><ul><li><b>أ.</b> تفتح «زميل» بحسابها الشخصي من البيت</li><li><b>ب.</b> تلصقه في مساعد عام مجاني، فلا أسماء فيه</li><li><b>ج.</b> تصوّره بهاتفها وترفع الصورة إلى تطبيق تلخيص</li><li><b>د.</b> تفتح «زميل» بحساب العمل من جهاز العمل</li></ul></li>
<li><p>يريد سليمان من «زميل» رسالة تطلب من مورّد تسليم فاتورة ناقصة. الأصل: «شركة مدار للإمداد لم تسلّم فاتورة العقد 77 بقيمة 310,000 ريال». أي أمر يكتب؟</p><ul><li><b>أ.</b> اكتب رسالة لشركة مدار للإمداد عن فاتورة العقد 77 بقيمة 310,000 ريال</li><li><b>ب.</b> اكتب رسالة مهذبة تطلب من مورّد فاتورة لم تُسلَّم، واترك [اسم المورّد] و[رقم العقد]</li><li><b>ج.</b> اكتب رسالة لمورّد عن فاتورة العقد 77 بقيمة 310,000 ريال</li><li><b>د.</b> اكتب رسالة</li></ul></li>
<li><p>المساعد المعتمد متوقف للصيانة، وعندك تقرير داخلي عاجل تريد اختصاره. عندك حساب شخصي في مساعد عام على هاتفك. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> تختصره في حسابك الشخصي، فالعجلة عذر</li><li><b>ب.</b> تحذف الأسماء ثم تختصره في حسابك الشخصي</li><li><b>ج.</b> تختصره بنفسك أو تنتظر، وتبلغ مشرفك بالتأخير</li><li><b>د.</b> ترسله إلى زميل عنده اشتراك مدفوع في مساعد عام ليختصره</li></ul></li>
<li><p>في رسالة تريد تلخيصها هذه الجملة: «يُعلن اسم الفائز بمناقصة تجديد المواقف يوم الأربعاء القادم، والعرض الفائز حتى الآن عرض المتقدم الثالث». ما نوع هذا المحتوى؟</p><ul><li><b>أ.</b> سري: قرار لم يصدر بعد</li><li><b>ب.</b> شخصي: فيه إشارة إلى متقدم</li><li><b>ج.</b> عام: المناقصات تُنشر للجميع</li><li><b>د.</b> حساس: يخص حالة صحية أو مالية لشخص</li></ul></li>
<li><p>تريد من المساعد المعتمد صياغة تنبيه لموظف تكرر غيابه. أي أمر من هذه الأوامر آمن ويكفي للمهمة؟</p><ul><li><b>أ.</b> اكتب تنبيهًا لفهد صاحب الرقم الوظيفي 5521 لغيابه بسبب جلسات غسيل الكلى</li><li><b>ب.</b> اكتب تنبيهًا لموظف يغيب بسبب جلسات غسيل الكلى، دون ذكر اسمه</li><li><b>ج.</b> اكتب رسالة لموظف</li><li><b>د.</b> اكتب تنبيهًا مهذبًا لموظف تكرر غيابه، واترك [الاسم] و[التواريخ]</li></ul></li>
<li><p>تقول لك زميلة: «لصقتُ أمس كشف رواتب في مساعد عام، ثم حذفتُ المحادثة، فلم يبقَ لها أثر». ما الرد الصحيح؟</p><ul><li><b>أ.</b> صحيح، حذف المحادثة يمحو كل ما أُدخل فيها عند مقدم الخدمة</li><li><b>ب.</b> قد يكون حُفظ أو سُجّل عند مقدم الخدمة، فيلزم الإبلاغ</li><li><b>ج.</b> لا خطر إلا إذا كان الحساب مجانيًا</li><li><b>د.</b> لا خطر، فالمساعد لا يفهم الأرقام</li></ul></li>
<li><p>تظهر في أعلى أداة معتمدة هذه العبارة: «لا تُدخل محتوى مصنفًا سريًا. المخرجات قد تكون غير دقيقة». عندك محضر لجنة مصنف «سري» وتريد منه قائمة بالمهام. ماذا تفعل؟</p><ul><li><b>أ.</b> تلصق المحضر، فالأداة معتمدة</li><li><b>ب.</b> تلصق المحضر وتكتب في أمرك أنه سري</li><li><b>ج.</b> تكتب بنفسك مستخلصًا منقّى بالمهام فقط</li><li><b>د.</b> تتجاهل العبارة، فهي تحذير عام لكل المستخدمين</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 3: طلب المساعدة والتعامل مع النتيجة بوصفها مسودة</h2>
<ol>
<li><p>يريد يزن من «زميل» رسالة اعتذار عن تأخر إصلاح مصعد. كتب: «اعتذر للمسافرة نوال الخريّف، جوالها 0557712340، عن تعطل المصعد عند البوابة 5 وهي على كرسي متحرك». اختر التفصيلين اللذين لا تحتاجهما الرسالة.</p><ul><li><b>أ.</b> رقم الجوال</li><li><b>ب.</b> تعطل المصعد</li><li><b>ج.</b> اسم المسافرة</li><li><b>د.</b> حاجتها إلى المصعد</li></ul></li>
<li><p>كتبت أبرار: «اكتب إعلانًا من 60 كلمة عن إغلاق موقف السيارات الشرقي يومين للصيانة، اعتمادًا على التعميم أدناه، ولا تذكر أسماء المقاولين، وضع في آخره ما لم تجده في التعميم». ما الذي ينقصه؟</p><ul><li><b>أ.</b> المخرج</li><li><b>ب.</b> القيود</li><li><b>ج.</b> الجمهور</li><li><b>د.</b> المراجعة</li></ul></li>
<li><p>طلب جواد من «زميل» ملخصًا لاجتماع الوردية، فعاد ملخص أنيق فيه: «يبدأ جدول المناوبات الجديد يوم السبت». الاجتماع كان قبل ساعة وجواد حضره. ما أول ما يفعله؟</p><ul><li><b>أ.</b> يطابق اليوم بملاحظات الاجتماع</li><li><b>ب.</b> يرسله، فهو حضر الاجتماع ويتذكره</li><li><b>ج.</b> يسأل المساعد: هل أنت متأكد من اليوم؟</li><li><b>د.</b> يرسله، فالملخص منظم ولغته سليمة</li></ul></li>
<li><p>كتب زميلك هذا الطلب: «لخّص محضر الاجتماع المرفق في خمس نقاط لمديري الأقسام، ولا تتجاوز 100 كلمة». أي عنصر من العناصر الخمسة ينقصه؟</p><ul><li><b>أ.</b> المراجعة</li><li><b>ب.</b> الجمهور</li><li><b>ج.</b> القيود</li><li><b>د.</b> المخرج</li></ul></li>
<li><p>أعاد المساعد ملخصًا منسقًا لاجتماع المشتريات، وفيه: «يُسلَّم التقرير الفني يوم 12 من الشهر». ما أول ما تفعله قبل إرسال الملخص؟</p><ul><li><b>أ.</b> ترسله، فتنسيقه يدل على دقته</li><li><b>ب.</b> تسأل المساعد: هل أنت متأكد؟</li><li><b>ج.</b> تولّد الملخص مرتين وتأخذ الموعد المتكرر</li><li><b>د.</b> تطابق الموعد بمحضر الاجتماع نفسه</li></ul></li>
<li><p>تعمل في خدمات المسافرين، وطلبت من المساعد ردًا على مسافر تأخرت رحلته. في المسودة: «يمكنك الانتظار في صالة كبار الزوار مجانًا». تعرف من عملك أن الصالة برسوم. ماذا تفعل؟</p><ul><li><b>أ.</b> تُبقي الجملة، فهي تُرضي المسافر</li><li><b>ب.</b> تحذف الجملة أو تصحّحها</li><li><b>ج.</b> تُبقيها وتضيف «بحسب المتاح»</li><li><b>د.</b> تسأل المساعد عن رسوم الصالة</li></ul></li>
<li><p>رتّب خطوات العمل مع المساعد المعتمد في تلخيص اجتماع، من الأولى إلى الأخيرة.</p><ul><li>ترسل الملخص باسمك</li><li>تكتب الطلب بعناصره الخمسة</li><li>تصحّح ما لا يطابق</li><li>تقرأ ملاحظات الاجتماع بنفسك</li><li>تطابق الملخص بالملاحظات جملة جملة</li></ul></li>
<li><p>عندك 40 رسالة شكوى فيها أسماء المسافرين وأرقام جوالاتهم، وتريد ملخصًا لأكثر الموضوعات تكرارًا. المساعد المعتمد يلخصها في دقيقة لو لصقتها كما هي، وتنقيتها تأخذ ربع ساعة. ماذا تفعل؟</p><ul><li><b>أ.</b> تنقّيها من الأسماء والأرقام ثم تلصقها</li><li><b>ب.</b> تلصقها كما هي، فالمساعد معتمد</li><li><b>ج.</b> تلصقها وتطلب من المساعد أن يتجاهل الأسماء</li><li><b>د.</b> تلصق نصفها كما هو لتوفّر نصف الوقت</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 4: قراءة الرسوم البيانية والجداول ولوحات المعلومات والمخرجات</h2>
<ol>
<li><p>تريد ريما من «زميل» ملخصًا لتعميم عن الإجازات. أي طلب من هذه يستوفي العناصر الخمسة؟</p><ul><li><b>أ.</b> لخّص التعميم أدناه في خمس نقاط</li><li><b>ب.</b> لخّص التعميم أدناه تلخيصًا دقيقًا شاملًا واضحًا ومفيدًا جدًّا</li><li><b>ج.</b> لخّص التعميم أدناه في خمس نقاط للموظفين الجدد، ولا تضف ما ليس فيه، واذكر ما لم تجده</li><li><b>د.</b> لخّص التعميم أدناه للموظفين الجدد بلغة بسيطة</li></ul></li>
<li><p>صفّى يزن لوحة الأعطال على صالته، فوجد عطلًا مسجلًا مرتين. اللوحة مبنية على جدول مشترك، وعنده صلاحية تحرير فيه. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> يحذف الصف المكرر من الجدول، فالخطأ واضح</li><li><b>ب.</b> يترك الجدول كما هو، ويبلغ مشرف البيانات بالصف المكرر</li><li><b>ج.</b> يضيف مرشِّحًا يخفي الصف المكرر ويتابع عمله</li><li><b>د.</b> ينسخ الجدول إلى ملف عنده ويصحّحه فيه</li></ul></li>
<li><p>رسم عنوانه «زمن إصلاح الأعطال، مطار النخيل، أكتوبر 2026»، مصدره نظام الصيانة، حُدّث اليوم، ومحوره بالساعات، وله مفتاح ألوان. في أسفله: «الإجمالي 96 عطلًا»، والأعمدة الأربعة: 20 و31 و18 و22.</p><ul><li><b>أ.</b> تسمية مفقودة</li><li><b>ب.</b> تاريخ قديم</li><li><b>ج.</b> مصدر مجهول</li><li><b>د.</b> إجمالي غير متسق</li></ul></li>
<li><p>رسم بياني عنوانه «رضا المسافرين 2026»، مصدره استطلاع الصالات، حُدّث أمس، والمرشِّح «كل المطارات»، ومحوره الرأسي أرقام من 1 إلى 5 بلا أي شرح. أي عنصر ينقصه؟</p><ul><li><b>أ.</b> المصدر</li><li><b>ب.</b> التاريخ</li><li><b>ج.</b> الوحدة</li><li><b>د.</b> المرشِّح</li></ul></li>
<li><p>لوحة البلاغات تعرض الرقم 1,240، وفي أعلاها: «المعروض الآن: مطار المرفأ، يونيو». نقل زميلك الرقم في تقريره بوصفه «بلاغات الشركة هذا العام». ما الذي أهمله؟</p><ul><li><b>أ.</b> المرشِّح</li><li><b>ب.</b> مفتاح الرسم</li><li><b>ج.</b> الوحدة</li><li><b>د.</b> المصدر</li></ul></li>
<li><p>في لوحة المشتريات بطاقة «إجمالي الطلبات: 5,300»، وتحتها جدول بثلاث إدارات: 2,100 و1,900 و1,150. تحتاج الإجمالي لتقريرك. ماذا تفعل؟</p><ul><li><b>أ.</b> تنقل 5,300، فالبطاقة هي الرقم الرسمي</li><li><b>ب.</b> تنقل مجموع الجدول، فالتفصيل أدق</li><li><b>ج.</b> تنقل متوسط الرقمين</li><li><b>د.</b> تسأل مالك اللوحة عن الفرق أولًا</li></ul></li>
<li><p>في ملخص كتبه المساعد للوحة الطلبات أربع جمل. أي جملة منها تنبؤ؟</p><ul><li><b>أ.</b> بلغت الطلبات 4,200 في مايو</li><li><b>ب.</b> ستزيد الطلبات في الصيف القادم</li><li><b>ج.</b> خدمة مطار الجبل ممتازة</li><li><b>د.</b> نفترض أن كل طلب من مسافر مختلف</li></ul></li>
<li><p>أنت مشرف وردية. تعرض لوحة الطوابير توصية آلية: «انقل موظفًا من البوابة 3 إلى نقطة المساعدة». تعلم أن في البوابة 3 رحلة لذوي الإعاقة بعد قليل، واللوحة لا تعرف ذلك. ماذا تفعل؟</p><ul><li><b>أ.</b> تنفّذ التوصية، فهي مبنية على بيانات</li><li><b>ب.</b> ترفض كل توصيات اللوحة من الآن</li><li><b>ج.</b> تنتظر أن تتكرر التوصية ثم تنفّذها</li><li><b>د.</b> تعدّها معلومة، وتقرر بما تعرفه</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 5: التحقق والتوقف</h2>
<ol>
<li><p>كتب سليمان في تقريره: «بلغت طلبات الشراء 412 طلبًا هذا العام». الرقم من لوحة كان في أعلاها: «المعروض الآن: إدارة الصيانة، الربع الأول». ما العنصر الذي لم يقرأه؟</p><ul><li><b>أ.</b> الوحدة</li><li><b>ب.</b> المصدر</li><li><b>ج.</b> مفتاح الرسم</li><li><b>د.</b> المرشِّح</li></ul></li>
<li><p>كتب «زميل» لريما إعلانًا داخليًا بأسماء الفائزين بجائزة الموظف المثالي، من جدول ألصقته. الأسماء صحيحة، والإعلان من عملها، لكن الإعلان ذكر مع كل اسم راتبه ورقم هويته.</p><ul><li><b>أ.</b> الدقة</li><li><b>ب.</b> الحساسية</li><li><b>ج.</b> التفويض</li><li><b>د.</b> المصدر</li></ul></li>
<li><p>أبرار في الاتصال. كتب لها «زميل» منشورًا عن خدمة جديدة لنقل الأمتعة، وفيه سعر الخدمة: 35 ريالًا. قائمة الأسعار المعتمدة أمامها تقول: 45 ريالًا. كل ما عدا ذلك يطابق القائمة، والنشر من عملها.</p><ul><li><b>أ.</b> تصعّد إلى مسؤول الامتثال</li><li><b>ب.</b> توقف المنشور مؤقتًا إلى أجل غير محدد</li><li><b>ج.</b> تعدّل السعر من القائمة، ثم تراجع المنشور مرة أخرى</li><li><b>د.</b> تستخدم المنشور كما هو، فالفرق صغير</li></ul></li>
<li><p>مسودة رد كتبها المساعد تقول إن مواقف السيارات مجانية في أول 30 دقيقة. لائحة الرسوم المعتمدة أمامك تقول: أول 15 دقيقة. أي فحص من الخمسة لم تجتزه المسودة؟</p><ul><li><b>أ.</b> الحساسية</li><li><b>ب.</b> الدقة</li><li><b>ج.</b> التفويض</li><li><b>د.</b> الأثر</li></ul></li>
<li><p>تعدّ عرضًا لزيادة ميزانية اللوحات الإرشادية، وأساسه جملة من المساعد: «تقرير عالمي يثبت أن اللوحات تقلل الاستفسارات إلى النصف». بحثت فلم تجد للتقرير أثرًا. ما القرار؟</p><ul><li><b>أ.</b> استخدم: الجملة منطقية</li><li><b>ب.</b> عدّل: اكتب «إلى الثلث» احتياطًا</li><li><b>ج.</b> أوقف مؤقتًا إلى أن تجد مصدرًا</li><li><b>د.</b> صعّد إلى مسؤول الامتثال</li></ul></li>
<li><p>تعمل في الاتصال، وكتب لك المساعد مسودة إشعار للمسافرين يشرح خطوات إخلاء الصالة عند الطوارئ. الصياغة واضحة، ولا تعرف هل تطابق الخطواتُ خطةَ الطوارئ المعتمدة. ما القرار؟</p><ul><li><b>أ.</b> صعّد إلى الجهة المسؤولة عن السلامة</li><li><b>ب.</b> استخدم: الصياغة واضحة ومفيدة</li><li><b>ج.</b> عدّل الصياغة لتكون أقصر ثم انشر</li><li><b>د.</b> أوقف مؤقتًا إلى أن تجد وقتًا لمراجعتها بنفسك</li></ul></li>
<li><p>طلبت من المساعد تلخيص 300 شكوى. جاء الملخص كله عن المسافرين الدائمين ومواقف السيارات، وأنت تعلم أن في الشكاوى رسائل كثيرة من عائلات ومن ذوي إعاقة. ما المشكلة في الملخص؟</p><ul><li><b>أ.</b> فيه رقم لا يطابق المصدر</li><li><b>ب.</b> فيه محتوى شخصي لا يلزم</li><li><b>ج.</b> يتجاوز صلاحيتك في الاطلاع</li><li><b>د.</b> غابت عنه فئات اشتكت فعلًا</li></ul></li>
<li><p>أنت موظف استقبال. كتب المساعد ردًا على مسافر فقد حقيبته، وفيه: «نعوّضك بمبلغ 2,000 ريال». المعلومات الأخرى في الرد تطابق سجل البلاغ. أي فحص يستدعي القرار، وما القرار؟</p><ul><li><b>أ.</b> الدقة: عدّل المبلغ إلى 1,000</li><li><b>ب.</b> المصدر: أوقف مؤقتًا</li><li><b>ج.</b> التفويض: صعّد إلى مشرفك</li><li><b>د.</b> لا شيء: استخدم</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 6: الإفصاح والمساءلة</h2>
<ol>
<li><p>ريما في لجنة توظيف. اقترح «زميل» معيارًا للفرز: «يُفضَّل من يسكن قرب المطار». لا شيء في الإعلان الوظيفي عن السكن، وطُلب منها تطبيق المعيار اليوم على 40 طلبًا.</p><ul><li><b>أ.</b> تعدّل المعيار بنفسها وتطبقه</li><li><b>ب.</b> تستخدم المعيار، فهو معقول</li><li><b>ج.</b> تصعّد إلى مالك عملية التوظيف قبل أي فرز</li><li><b>د.</b> توقف الفرز وتنتظر أن يُسأل عنه</li></ul></li>
<li><p>لخّص يزن تقرير الأعطال الشهري بمساعدة «زميل»، ثم طابق عدد الأعطال وتواريخها بسجل الصيانة. أي سطر يكتبه في آخر الملخص؟</p><ul><li><b>أ.</b> لُخّص هذا التقرير بمساعدة «زميل»، وطابقتُ الأعداد والتواريخ بسجل الصيانة</li><li><b>ب.</b> راجعتُ هذا الملخص مراجعة كاملة قبل إرساله</li><li><b>ج.</b> لخّصه «زميل»، وقد يكون فيه أخطاء لم أنتبه لها</li><li><b>د.</b> أُعدّ هذا الملخص بالاستعانة بأدوات رقمية حديثة</li></ul></li>
<li><p>كتب «زميل» لسليمان ردًا على مورّد، وأضاف سليمان سطر إفصاح يسمّي المساعد، ثم أرسل الرد دون أن يطابق مبلغ الفاتورة. المبلغ خاطئ، واعترض المورّد. من المسؤول؟</p><ul><li><b>أ.</b> لا أحد، فقد أفصح سليمان عن استخدام المساعد</li><li><b>ب.</b> حمدان، مالك «زميل»</li><li><b>ج.</b> مقدم خدمة المساعد</li><li><b>د.</b> سليمان، لأنه أرسل الرد باسمه</li></ul></li>
<li><p>أرسلتَ إلى مديرك تقريرًا فيه نسبة ولّدها المساعد واعتمدتَها دون مراجعة، ثم تبيّن أنها خاطئة وبُني عليها قرار. من المسؤول عن الخطأ؟</p><ul><li><b>أ.</b> مقدم خدمة المساعد</li><li><b>ب.</b> مالك النظام في الشركة</li><li><b>ج.</b> المساعد نفسه</li><li><b>د.</b> أنت، لأنه قُدّم باسمك</li></ul></li>
<li><p>استعنتَ بالمساعد المعتمد في ترجمة إعلان إلى الإنجليزية، ثم راجعتَ أسماء البوابات والتواريخ على النص العربي. أي سطر إفصاح يصلح؟</p><ul><li><b>أ.</b> تُرجم هذا الإعلان آليًا بالكامل، وقد يحوي أخطاء لم تُراجَع بعد</li><li><b>ب.</b> تُرجم بمساعدة المساعد المعتمد، وراجعتُ البوابات والتواريخ</li><li><b>ج.</b> راجع هذا الإعلان المختصون</li><li><b>د.</b> أُعدّ هذا الإعلان بأحدث التقنيات</li></ul></li>
<li><p>أعددتَ عرضًا داخليًا واستعنتَ بالمساعد في نصف شرائحه. لا تعرف هل تشترط سياسة جهتك الإفصاح في العروض الداخلية. ماذا تفعل قبل التقديم؟</p><ul><li><b>أ.</b> تقرأ سياسة الجهة أو تسأل عنها</li><li><b>ب.</b> لا تفصح، فالعرض داخلي</li><li><b>ج.</b> تفصح إن سألك أحد فقط</li><li><b>د.</b> تقرر بنفسك بحسب حجم المساعدة في العرض</li></ul></li>
<li><p>حلّل المساعد 200 تعليق من المسافرين واستنتج أن أكثر الشكاوى عن اللوحات الإرشادية. راجعتَ بنفسك 20 تعليقًا فقط ووجدتها تؤيد ذلك. كيف تكتب النتيجة في تقريرك؟</p><ul><li><b>أ.</b> ثبت من تحليل 200 تعليق كاملة أن أكثر الشكاوى عن اللوحات الإرشادية</li><li><b>ب.</b> يؤكد المساعد أن أكثر الشكاوى عن اللوحات</li><li><b>ج.</b> تحليل أولي بمساعدة المساعد، راجعتُ منه 20 تعليقًا، يرجّح اللوحات</li><li><b>د.</b> أكثر الشكاوى عن اللوحات الإرشادية</li></ul></li>
<li><p>أرسل موظف ردًا ولّده المساعد إلى مسافر دون أن يقرأه، وفيه وعد خاطئ باسم الشركة، فنشره المسافر. ما الذي كان سيمنع الضرر؟</p><ul><li><b>أ.</b> سطر إفصاح يسمّي المساعد في آخر الرد</li><li><b>ب.</b> نموذج أحدث للمساعد</li><li><b>ج.</b> حذف الرد بعد نشره</li><li><b>د.</b> قراءة الموظف للرد قبل إرساله</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 7: التصعيد والمراجعة البشرية</h2>
<ol>
<li><p>كتبت أبرار في آخر بيان صحفي: «استعنتُ بالمساعد المعتمد «زميل» في صياغة هذا البيان». ما الذي ينقص سطر الإفصاح؟</p><ul><li><b>أ.</b> اسم الأداة المستخدمة</li><li><b>ب.</b> ما جرى التحقق منه، وعلى أي مصدر</li><li><b>ج.</b> تنبيه إلى أن البيان قد يحوي أخطاء</li><li><b>د.</b> اسم النموذج ورقم إصداره</li></ul></li>
<li><p>تطلب شركة سيارات أجرة من يزن قائمة بمواعيد وصول المسافرين وأسمائهم «لتحسين الخدمة». عنده صلاحية على جدول الرحلات. لمن يرفع الطلب؟</p><ul><li><b>أ.</b> نهى، مشرفة البيانات</li><li><b>ب.</b> حمدان، مالك «زميل»</li><li><b>ج.</b> سامية، مالكة بيانات المسافرين</li><li><b>د.</b> لا أحد: عنده صلاحية، فيرسل القائمة</li></ul></li>
<li><p>لاحظت ريما أن «زميل» يصف المتقدمات في ملخصات السير الذاتية بكلمات عن المظهر، ولا يفعل ذلك مع المتقدمين. تكرر ذلك في ثلاثة ملخصات. لمن ترفع الملاحظة؟</p><ul><li><b>أ.</b> حمدان، مالك «زميل»، ومعه مسؤولة الامتثال</li><li><b>ب.</b> نهى، مشرفة البيانات</li><li><b>ج.</b> لا أحد: تحذف الكلمات من ملخصاتها وتتابع</li><li><b>د.</b> سامية، مالكة بيانات المسافرين</li></ul></li>
<li><p>يزن مخطط صيانة. تعرض لوحة الصيانة توصية آلية: «أجّل فحص سير الأمتعة في الصالة 2 أسبوعين». آخر فحص أظهر اهتراء في السير، واللوحة لا تعرض ذلك. تأجيل الفحص ليس من صلاحيته، ومديره في إجازة.</p><ul><li><b>أ.</b> ينفّذ التوصية، فهي مبنية على البيانات</li><li><b>ب.</b> يرفض التوصية ويقدّم الفحص من عنده</li><li><b>ج.</b> ينتظر عودة مديره من الإجازة</li><li><b>د.</b> لا ينفّذ، ويرفعها اليوم إلى من ينوب عن مديره</li></ul></li>
<li><p>تلاحظ أن طلبات مطار الجبل في لوحة خدمات المسافرين مسجلة مرتين في أسبوع كامل. لمن ترفع الملاحظة؟</p><ul><li><b>أ.</b> مسؤول الامتثال</li><li><b>ب.</b> مالك نظام الذكاء الاصطناعي</li><li><b>ج.</b> مشرف البيانات</li><li><b>د.</b> المورّد الذي ركّب اللوحة</li></ul></li>
<li><p>منذ أسبوع يجيب المساعد المعتمد عن أسئلة الموظفين في سياسة الإجازات بإجابة خاطئة تتكرر. لمن ترفع المسألة؟</p><ul><li><b>أ.</b> مالك نظام الذكاء الاصطناعي</li><li><b>ب.</b> مشرف البيانات</li><li><b>ج.</b> كل زملائك في مجموعة المحادثة</li><li><b>د.</b> لا أحد: تتجنب السؤال عن الإجازات</li></ul></li>
<li><p>لصق زميلك بالخطأ قائمة فيها أرقام هويات مسافرين في مساعد عام غير معتمد، وأخبرك وهو قلق. لمن تُرفع الحادثة أولًا؟</p><ul><li><b>أ.</b> لا تُرفع: يكفي أن يحذف المحادثة</li><li><b>ب.</b> مسؤول الامتثال</li><li><b>ج.</b> مشرف البيانات</li><li><b>د.</b> مقدم خدمة المساعد العام</li></ul></li>
<li><p>تطلب منك إدارة التسويق نسخة من بيانات المسافرين التي تعمل عليها، لتحليل لم يُذكر حين جُمعت البيانات. عندك صلاحية على الملف. ماذا تفعل؟</p><ul><li><b>أ.</b> ترسل النسخة، فالطلب من داخل الشركة</li><li><b>ب.</b> ترسلها بعد حذف الأسماء</li><li><b>ج.</b> تحيل الطلب إلى مالك البيانات</li><li><b>د.</b> ترفض الطلب نهائيًا</li></ul></li>
<li><p>أنت منسق عقود. يقترح المساعد في مسودته إنهاء عقد مورّد تأخر في التسليم، والمورّد ينتظر ردك اليوم. المسودة دقيقة في وقائعها. لمن ترفع الأمر؟</p><ul><li><b>أ.</b> مشرف البيانات</li><li><b>ب.</b> مالك نظام الذكاء الاصطناعي</li><li><b>ج.</b> لا أحد: الوقائع دقيقة فترسل الرد</li><li><b>د.</b> مشرفك المباشر</li></ul></li>
</ol>
</section>

احيته، ولو نقّى","","يتخذ قرارًا ليس له: قد يأذن المالك بشروط"],"lo":["LO7"],"day":7,"session":1,"slide":{"deck":"module7","id":"beyond-authority","title":"ثلاث علامات على أن الطلب يتجاوزك"},"level":"apply","pool":"practice"},{"id":"q-route-05","type":"single","prompt":"أنت منسق عقود. يقترح المساعد في مسودته إنهاء عقد مورّد تأخر في التسليم، والمورّد ينتظر ردك اليوم. المسودة دقيقة في وقائعها. لمن ترفع الأمر؟","options":[{"key":"أ","text":"مشرف البيانات"},{"key":"ب","text":"مالك نظام الذكاء الاصطناعي"},{"key":"ج","text":"لا أحد: الوقائع دقيقة فترسل الرد"},{"key":"د","text":"مشرفك المباشر"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"إنهاء عقد قرار يمس موارد كبيرة ويتجاوز صلاحية المنسق. المشرف المباشر هو طريق الصلاحيات، وهو من تسأله حين لا تعرف لمن ترفع.","misconceptions":["يبحث عن صاحب للبيانات، والمسألة قرار تعاقدي","يعدّها مشكلة في الأداة، والمسودة دقيقة","يعدّ دقة الوقائع إذنًا بقرار يتجاوز صلاحيته",""],"lo":["LO7"],"day":7,"session":1,"slide":{"deck":"module7","id":"beyond-authority","title":"ثلاث علامات على أن الطلب يتجاوزك"},"level":"apply","pool":"practice"}]}</script>
